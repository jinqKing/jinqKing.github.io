<style>
/* Film card grid layout */
.film-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 2em;
  margin: 2em 0;
}

.film-card {
  background: #f8f9fa;
  border-radius: 0.8em;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.film-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}

.film-poster {
  width: 100%;
  height: 330px;
  object-fit: cover;
  background: #e9ecef;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #6c757d;
  font-size: 0.9em;
}

.film-info {
  padding: 1em;
}

.film-title {
  font-size: 1em;
  font-weight: bold;
  margin: 0 0 0.5em 0;
  color: #212529;
}

.film-meta {
  font-size: 0.85em;
  color: #6c757d;
  margin: 0.3em 0;
}

.film-rating {
  display: flex;
  align-items: center;
  gap: 0.3em;
  margin-top: 0.5em;
}

.star {
  color: #ffc107;
}

.rating-num {
  font-weight: bold;
  color: #212529;
}

.film-year {
  font-size: 0.8em;
  color: #999;
}

.film-genre {
  font-size: 0.75em;
  color: #6c757d;
  margin-top: 0.5em;
}

/* Filter section */
.film-filters {
  text-align: center;
  margin: 2em 0;
  padding: 1em;
  background: #f8f9fa;
  border-radius: 0.8em;
}

.film-filters .filter-category {
  display: inline-block;
  margin: 0.3em;
}

.film-filters input[type="checkbox"] {
  display: none;
}

.film-filters label {
  display: inline-block;
  padding: 0.5em 1em;
  border: 2px solid #dee2e6;
  border-radius: 0.5em;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 0.9em;
}

.film-filters input:checked + label {
  background: #212529;
  color: white;
  border-color: #212529;
}

.film-card.hidden {
  display: none;
}

/* Summary section */
.film-summary {
  background: #f8f9fa;
  padding: 1.5em;
  border-radius: 0.8em;
  margin: 2em 0;
}

.film-summary h3 {
  margin-top: 0;
}

.summary-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 2em;
  margin-top: 1em;
}

.stat-item {
  text-align: center;
}

.stat-number {
  font-size: 2em;
  font-weight: bold;
  color: #212529;
}

.stat-label {
  font-size: 0.85em;
  color: #6c757d;
}
</style>

<script>
// Film data - replace with your Douban export
const films = [

  {

    type: "contemporary",

  },
  {
    title: "燃烧",
    year: 2018,
    rating: 8.1,

    type: "art",

  },
  {
    title: "月光男孩",
    year: 2016,
    rating: 7.4,
    genre: "剧情 / 同性",
    type: "art",
    poster: null,
    review: "三段式叙事，关于身份认同与成长的温柔诗篇。"
  },
  {
    title: "爱在黎明破晓前",
    year: 1995,
    rating: 8.8,
    genre: "剧情 / 爱情",
    type: "classic",
    poster: null,

  },
  {
    title: "布达佩斯大饭店",
    year: 2014,
    rating: 8.9,
    genre: "剧情 / 喜剧",
    type: "contemporary",
    poster: null,
    review: "韦斯·安德森的对称美学极致展现，欧洲旧时代的挽歌。"
  }
];

// Render film cards
function renderFilms() {
  const grid = document.getElementById('filmGrid');
  grid.innerHTML = '';

  films.forEach((film, index) => {
    const card = document.createElement('div');
    card.className = 'film-card';
    card.id = `film-${index}`;
    card.dataset.type = film.type;

    const stars = '★'.repeat(Math.floor(film.rating / 2)) + '☆'.repeat(5 - Math.floor(film.rating / 2));

    card.innerHTML = `
      <div class="film-poster">
        ${film.poster ? `<img src="${film.poster}" alt="${film.title}">` : `<span>${film.title}</span>`}
      </div>
      <div class="film-info">
        <h4 class="film-title">${film.title}</h4>
        <div class="film-meta">
          <span class="film-year">${film.year}</span>
        </div>
        <div class="film-rating">
          <span class="star">${stars}</span>
          <span class="rating-num">${film.rating}</span>
        </div>
        <div class="film-genre">${film.genre}</div>
      </div>
    `;

    grid.appendChild(card);
  });

  updateStats();
}

// Filter films by type
function filterFilms(type) {
  const cards = document.querySelectorAll('.film-card');

  if (type === 'all') {
    cards.forEach(card => card.classList.remove('hidden'));
  } else {
    cards.forEach(card => {
      if (card.dataset.type === type) {
        card.classList.remove('hidden');
      } else {
        card.classList.add('hidden');
      }
    });
  }
}

// Update summary statistics
function updateStats() {
  const visibleCards = document.querySelectorAll('.film-card:not(.hidden)');
  const totalFilms = films.length;
  const avgRating = (films.reduce((sum, film) => sum + film.rating, 0) / totalFilms).toFixed(1);

  document.querySelector('.summary-stats .stat-number').textContent = totalFilms;
  document.querySelectorAll('.summary-stats .stat-number')[1].textContent = avgRating;
}

// Initialize
document.addEventListener('DOMContentLoaded', renderFilms);
</script>
